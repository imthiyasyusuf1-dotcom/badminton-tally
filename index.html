<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Badminton Tally</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    min-height: 100vh;
    color: #fff;
    padding: 16px;
    padding-bottom: 60px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 10px 0 4px;
    background: linear-gradient(90deg, #22d3ee, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .sub {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status {
    text-align: center;
    font-size: 11px;
    color: #64748b;
    margin-bottom: 10px;
    min-height: 14px;
  }
  .players {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 420px;
    margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(10px);
  }
  .card.leader {
    border: 1px solid #fbbf24;
    box-shadow: 0 0 20px rgba(251,191,36,0.25);
  }
  .name-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .crown { font-size: 18px; display: none; }
  .card.leader .crown { display: inline; }
  .name {
    font-size: 17px;
    font-weight: 700;
  }
  .score {
    font-size: 26px;
    font-weight: 800;
    min-width: 36px;
    text-align: center;
    color: #22d3ee;
  }
  .btns {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button.adj {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    user-select: none;
  }
  .plus { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .minus { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .footer {
    max-width: 420px;
    margin: 20px auto 0;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .reset {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #cbd5e1;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .leaderboard {
    max-width: 420px;
    margin: 18px auto 0;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <h1>🏸 Badminton Tally</h1>
  <div class="sub">Tap + every win, - to undo. Updates for everyone.</div>
  <div class="status" id="status">syncing...</div>

  <div class="players" id="players"></div>

  <div class="leaderboard" id="leaderTxt"></div>

  <div class="footer">
    <button class="reset" id="resetBtn">Reset all scores</button>
  </div>

<script>
const PLAYERS = ["Matty", "Wilford", "Sidney", "Marcus", "Yusuf"];
// Tiny self-hosted sync server (Node + Tailscale Funnel), no signup needed
const API_BASE = "https://macbook.tail5cd145.ts.net:8841";

let state = null;
let polling = null;

function defaultState() {
  const scores = {};
  PLAYERS.forEach(p => scores[p] = 0);
  return { scores };
}

async function fetchState() {
  const res = await fetch(`${API_BASE}/scores`, { cache: "no-store" });
  if (!res.ok) throw new Error("fetch failed");
  const scores = await res.json();
  return { scores };
}

async function saveState() {
  // state is saved per-action via /adjust or /reset, not a bulk PUT
}

function render() {
  const container = document.getElementById("players");
  container.innerHTML = "";
  const max = Math.max(...PLAYERS.map(p => state.scores[p] || 0));
  PLAYERS.forEach(p => {
    const score = state.scores[p] || 0;
    const isLeader = score === max && max > 0;
    const card = document.createElement("div");
    card.className = "card" + (isLeader ? " leader" : "");
    card.innerHTML = `
      <div class="name-wrap">
        <span class="crown">👑</span>
        <span class="name">${p}</span>
      </div>
      <div class="score">${score}</div>
      <div class="btns">
        <button class="adj minus" data-p="${p}" data-d="-1">-</button>
        <button class="adj plus" data-p="${p}" data-d="1">+</button>
      </div>
    `;
    container.appendChild(card);
  });

  const sorted = [...PLAYERS].sort((a,b) => (state.scores[b]||0) - (state.scores[a]||0));
  const top = sorted[0];
  if ((state.scores[top]||0) > 0) {
    document.getElementById("leaderTxt").textContent = `${top} is winning with ${state.scores[top]} wins`;
  } else {
    document.getElementById("leaderTxt").textContent = "No games won yet";
  }

  container.querySelectorAll("button.adj").forEach(btn => {
    btn.addEventListener("click", onAdjust);
  });
}

async function onAdjust(e) {
  const p = e.currentTarget.dataset.p;
  const d = parseInt(e.currentTarget.dataset.d, 10);
  state.scores[p] = Math.max(0, (state.scores[p] || 0) + d);
  render();
  setStatus("saving...");
  try {
    const res = await fetch(`${API_BASE}/adjust`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ player: p, delta: d })
    });
    const scores = await res.json();
    state = { scores };
    render();
    setStatus("synced ✓");
  } catch (err) {
    setStatus("offline, retrying...");
  }
}

function setStatus(txt) {
  document.getElementById("status").textContent = txt;
}

async function init() {
  try {
    state = await fetchState();
  } catch (e) {
    state = defaultState();
    setStatus("offline, retrying...");
  }
  render();
  setStatus("synced ✓");
  startPolling();
}

function startPolling() {
  if (polling) clearInterval(polling);
  polling = setInterval(async () => {
    try {
      const fresh = await fetchState();
      if (JSON.stringify(fresh) !== JSON.stringify(state)) {
        state = fresh;
        render();
      }
      setStatus("synced ✓");
    } catch (e) {
      setStatus("offline, retrying...");
    }
  }, 2500);
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("Reset all scores to 0?")) return;
  state = defaultState();
  render();
  setStatus("saving...");
  try {
    const res = await fetch(`${API_BASE}/reset`, { method: "POST" });
    const scores = await res.json();
    state = { scores };
    render();
    setStatus("synced ✓");
  } catch (e) {
    setStatus("offline");
  }
});

init();
</script>
</body>
</html>
